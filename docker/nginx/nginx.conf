server {
    listen 80;
    server_name localhost;
    
    root /u/apps/site/public;
    index index.php index.html index.htm;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass phpfpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # Serve storage directory
    location /storage/ {
        alias /u/apps/data/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        
        # Allow JSON files with proper content type
        location ~ \.json$ {
            add_header Content-Type application/json;
        }
        
        # Serve log files as plain text (viewable in browser)
        location ~ \.log$ {
            add_header Content-Type "text/plain; charset=utf-8";
        }
        
        # Deny access to potentially dangerous file types
        location ~ \.(php|sh|sql|env)$ {
            deny all;
        }
    }
    
    location ~ /\.ht {
        deny all;
    }
}