# Trust the proxy networks (add your proxy-net CIDR if you want to be exact)
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Respect TLS termination at the proxy
map $http_x_forwarded_proto $fastcgi_https { default off; https on; }
map $http_x_forwarded_proto $server_port_override { default $server_port; https 443; }

server {
    listen 80;
    server_name _;
    
    root /u/apps/site/public;
    index index.php;
    
    # Everything routes to the front controller
    location / {
        try_files $uri /index.php?$query_string;
    }
    
    # Only allow executing /index.php (security improvement)
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param SERVER_PORT $server_port_override;
        fastcgi_pass phpfpm:9000;
    }
    
    # Block any other .php (defense-in-depth)
    location ~ \.php$ { 
        return 404; 
    }
    
    # Serve static directory 
    location /static/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Access-Control-Allow-Origin "*";
        
        # Restrict to allowed directories only
        location ~ ^/static/(?!(failures|links|sources|views)/) {
            return 403;
        }

        # Scope to allowed directories using captured groups
        location ~ ^/static/(failures|links|sources|views)/(.*)$ {
            alias /u/apps/data/$1/$2;
        }
        
        # Allow JSON files with proper content type
        location ~ \.json$ {
            add_header Content-Type application/json;
            add_header Cache-Control "public, max-age=3600";
        }
        
        
        # Deny access to potentially dangerous file types
        location ~ \.(php|sh|sql|env|ini|conf|bak)$ {
            return 403;
        }
    }
    
    # No dotfiles
    location ~ /\. { 
        deny all; 
    }
    
    # Security headers
    client_max_body_size 25m;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    
    # Healthcheck
    location = /health { 
        return 200 'ok'; 
        add_header Content-Type text/plain; 
    }
}
