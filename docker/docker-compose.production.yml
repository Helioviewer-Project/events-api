x-phpfpm-common: &phpfpm-common
  build: ./phpfpm
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - ../:/u/apps/site
    - ${APP_STORAGE:-../storage}:/u/apps/data:rw
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - eventsapi
  restart: unless-stopped

services:
  nginx:
    image: nginx:alpine
    container_name: eventsapi-nginx
    expose: ["80"]
    volumes:
      - ../:/u/apps/site:ro
      - ${APP_STORAGE:-../storage}:/u/apps/data:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpfpm
    networks:
      - eventsapi
      - proxy
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}

  phpfpm:
    <<: *phpfpm-common
    container_name: eventsapi-phpfpm
    restart: unless-stopped

  scheduler:
    <<: *phpfpm-common
    container_name: eventsapi-scheduler
    command: bash -c "while true; do php /u/apps/site/bin/scheduler.php; sleep 60; done"
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: eventsapi-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-eventsapi}
      POSTGRES_USER: ${DB_USER:-eventsapi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventsapi_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventsapi
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventsapi} -d ${DB_NAME:-eventsapi}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: eventsapi-redis
    command: redis-server --appendonly yes --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - eventsapi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  coordinator:
    image: ghcr.io/helioviewer-project/coordinator
    container_name: eventsapi-coordinator
    networks:
      - eventsapi
    restart: unless-stopped
    healthcheck:
      interval: 60s

volumes:
  postgres_data:
  redis_data:

networks:
  eventsapi:
    driver: bridge
  proxy:
    external: true
    name: proxy-net
