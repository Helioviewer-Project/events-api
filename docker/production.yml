services:
  nginx:
    expose: ["80"]
    ports: []  # Remove port exposure for production
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - eventsapi
      - proxy

  phpfpm:
    restart: unless-stopped

  scheduler:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: proxy-net
