; Errors go to the log (stderr, docker logs), never into a response
display_errors = Off
display_startup_errors = Off
log_errors = On

; How often, in seconds, opcache checks a file for changes. Production sets 60
; in its compose file; unset (dev) means every request, so edits show at once.
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ}
opcache.interned_strings_buffer = 16
