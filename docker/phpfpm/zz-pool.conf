; Loaded after the image's www.conf and zz-docker.conf, so these win.
[www]
; The default of 5 let a few slow movie requests, which mostly wait on the
; coordinator, block every other request. Sized for production: 4 cores,
; 15 GB RAM; 16 workers at the 512M movie limit still fit in 8 GB.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers that grew on a large request
pm.max_requests = 500

; Time and peak memory of every request, in docker logs
access.format = "%t \"%m %{REQUEST_URI}e\" %s %{milli}dms %{megabytes}MMB %C%%"
