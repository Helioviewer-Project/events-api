services:
  nginx:
    image: nginx:alpine
    container_name: eventsapi-nginx
    ports:
      - "8082:80"
    volumes:
      - ../:/u/apps/site
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpfpm
    networks:
      - eventsapi

  phpfpm:
    build: ./phpfpm
    container_name: eventsapi-phpfpm
    volumes:
      - ../:/u/apps/site
      - ../storage/:/u/apps/data
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=eventsapi
      - DB_USER=eventsapi
      - DB_PASSWORD=eventsapi_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=10
    depends_on:
      - postgres
      - redis
    networks:
      - eventsapi

  postgres:
    image: postgres:15-alpine
    container_name: eventsapi-postgres
    environment:
      - POSTGRES_DB=eventsapi
      - POSTGRES_USER=eventsapi
      - POSTGRES_PASSWORD=eventsapi_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eventsapi

  redis:
    image: redis:7-alpine
    container_name: eventsapi-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eventsapi

volumes:
  postgres_data:
  redis_data:

networks:
  eventsapi:
    driver: bridge