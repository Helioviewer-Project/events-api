services:
  nginx:
    image: nginx:alpine
    container_name: eventsapi-nginx
    ports:
      - "8082:80"
    volumes:
      - ../:/u/apps/site
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpfpm
    networks:
      - eventsapi

  phpfpm:
    build: ./phpfpm
    container_name: eventsapi-phpfpm
    volumes:
      - ../:/u/apps/site
    networks:
      - eventsapi

networks:
  eventsapi:
    driver: bridge